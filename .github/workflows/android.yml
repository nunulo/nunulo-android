name: Android

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AMAP_ANDROID_KEY_DEBUG: ${{ secrets.AMAP_ANDROID_KEY_DEBUG }}
      AMAP_ANDROID_KEY_RELEASE: ${{ secrets.AMAP_ANDROID_KEY_RELEASE }}
      NUNULO_RELEASE_STORE_PASSWORD: ${{ secrets.NUNULO_RELEASE_STORE_PASSWORD }}
      NUNULO_RELEASE_KEY_ALIAS: ${{ secrets.NUNULO_RELEASE_KEY_ALIAS }}
      NUNULO_RELEASE_KEY_PASSWORD: ${{ secrets.NUNULO_RELEASE_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - name: Prepare release signing
        env:
          NUNULO_RELEASE_KEYSTORE_BASE64: ${{ secrets.NUNULO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$NUNULO_RELEASE_KEYSTORE_BASE64"
          keystore="$RUNNER_TEMP/nunulo-release.keystore"
          printf '%s' "$NUNULO_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          printf 'NUNULO_RELEASE_KEYSTORE_PATH=%s\n' "$keystore" >> "$GITHUB_ENV"
      - name: Build and test
        run: ./gradlew :app:verifyReleaseConfiguration :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - name: Verify release identity and map key
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apk=app/build/outputs/apk/release/app-release.apk
          certificates="$RUNNER_TEMP/nunulo-release-certificates.txt"
          $build_tools/apksigner verify --print-certs "$apk" > "$certificates" 2>&1
          actual_sha1="$(awk -F': ' 'tolower($0) ~ /certificate sha-1 digest/ && !found { value=$NF; found=1 } END { print value }' "$certificates" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          application_id="$($ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest application-id "$apk" | tr -d '\r\n')"
          version_code="$($ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest version-code "$apk" | tr -d '\r\n')"
          manifest="$RUNNER_TEMP/nunulo-release-manifest.xml"
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest print "$apk" > "$manifest"
          printf 'certificate_sha1=%s\napplication_id=%s\nversion_code=%s\n' "$actual_sha1" "$application_id" "$version_code"
          test "$actual_sha1" = "ced42065d8199c19ad84c970a4bbfd96db377c10"
          test "$application_id" = "com.lumokato.nunulo"
          test "$version_code" = "6"
          grep -Fq "$AMAP_ANDROID_KEY_RELEASE" "$manifest"
      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          version_name="$($ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest version-name "$apk" | tr -d '\r\n')"
          expected_tag="v${version_name}"
          printf 'version_name=%s\nexpected_tag=%s\nactual_tag=%s\n' "$version_name" "$expected_tag" "$GITHUB_REF_NAME"
          test "$GITHUB_REF_NAME" = "$expected_tag"
      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/nunulo-android.apk"
          cd "$RUNNER_TEMP"
          sha256sum nunulo-android.apk > nunulo-android.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nunulo-android-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/nunulo-android.apk
            ${{ runner.temp }}/nunulo-android.sha256
